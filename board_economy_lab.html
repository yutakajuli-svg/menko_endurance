<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MENKO ENDURANCE - BOARD TEST</title>
<style>
:root{--paper:#f3efe6;--ink:#252321;--line:#c6beb1;--red:#ba3c3a;--blue:#3578b8;--wood:#a88b6d;--muted:#706a63}*{box-sizing:border-box}body{margin:0;background:#ddd5c8;color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif}main{width:min(720px,calc(100% - 18px));margin:15px auto 38px}h1{font-size:clamp(20px,5vw,29px);margin:0}.lead{margin:4px 0 12px;font-size:12px;color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 10px #3f2b1d1a}.heads{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:9px}.head{padding:10px 12px}.head:last-child{text-align:right}.name{font-size:15px;font-weight:900}.red{color:var(--red)}.blue{color:var(--blue)}.v{font-weight:900;color:#80786f}.stat{font-size:12px;margin-top:4px}.pips{display:inline-flex;gap:3px;vertical-align:-1px}.pip{width:13px;height:9px;border:1px solid #aaa197;background:#d6d0c6;border-radius:2px}.pip.red{background:var(--red);border-color:#8d2826}.pip.blue{background:var(--blue);border-color:#235a8e}.message{min-height:62px;padding:10px 13px;margin-bottom:9px;line-height:1.45}.message strong{display:block}.message span{font-size:12px;color:var(--muted)}.board{height:min(640px,86vw);min-height:330px;position:relative;overflow:hidden;background:radial-gradient(circle at 48% 48%,#cdb69e,#a7896b 82%);border:9px solid #795e48}.board:before{content:"";position:absolute;inset:15px;border:1px solid #e3cfb8;pointer-events:none}.target{position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #4d3d31}.target:after,.target:before{content:"";position:absolute;background:#fff}.target:after{width:2px;height:62px;left:18px;top:-12px}.target:before{height:2px;width:62px;top:18px;left:-12px}.card{position:absolute;width:70px;height:70px;transform:translate(-50%,-50%) rotate(var(--rot));z-index:var(--z);transition:transform .58s cubic-bezier(.16,.78,.25,1),filter .2s;filter:drop-shadow(4px 5px 0 #3b291a55)}.shape{position:absolute;inset:0;clip-path:polygon(12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%,0 12%);background:#eee7d9;border:3px solid #37312b;display:grid;place-items:center;font-weight:900}.card.red .shape{border-color:var(--red)}.card.blue .shape{border-color:var(--blue)}.back{font-size:23px;color:#736a60}.face{display:none;text-align:center;font-size:15px;line-height:1.15}.face small{display:block;margin-top:4px;font-size:9px;color:#655e56}.card.flip{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(calc(var(--rot) + 180deg));filter:drop-shadow(1px 1px 0 #3b291a66)}.card.flip .shape{background:#f6d986}.card.flip.red .shape{background:#eaa39d}.card.flip.blue .shape{background:#a7cbe9}.card.flip .back{display:none}.card.flip .face{display:block}.controls{padding:10px 12px;margin-top:9px}.gaugehead{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}.gauge{height:25px;border:2px solid #55483d;background:#e5ddcf;position:relative;overflow:hidden}.zones{position:absolute;inset:0;background:linear-gradient(90deg,#8d8d88 0 18%,#b6afa6 18% 40%,#f0eee9 40% 60%,#e3c486 60% 68%,#c69a60 68% 85%,#85766c 85%)}.needle{position:absolute;top:-3px;bottom:-3px;width:4px;background:#201e1c;box-shadow:0 0 0 1px #fff}.throw{width:100%;border:0;margin-top:9px;background:#29241f;color:#fff;padding:12px;font:inherit;font-weight:900;letter-spacing:.07em;cursor:pointer}.throw:disabled{opacity:.48}.reset{display:block;margin:10px auto 0;border:0;background:transparent;text-decoration:underline;color:var(--muted);font:12px inherit;cursor:pointer}.hint{font-size:11px;color:var(--muted);margin:9px 2px 0;line-height:1.55}@media(max-width:480px){.card{width:56px;height:56px}.board{border-width:6px}.face{font-size:12px}.heads{grid-template-columns:1fr 26px 1fr}}
</style></head><body><main>
<h1>MENKO ENDURANCE / 盤面テスト</h1><p class="lead">いつものように投げるだけの試遊版です。</p>
<section class="panel heads"><div class="head"><div class="name red">RED / プレイヤー</div><div class="stat">HP <b id="pHp"></b>　息 <span class="pips" id="pStam"></span></div></div><div class="v">VS</div><div class="head"><div class="name blue">BLUE / CPU</div><div class="stat">HP <b id="cHp"></b>　息 <span class="pips" id="cStam"></span></div></div></section>
<section class="panel message" id="message"></section><section class="board" id="board"><div class="target"></div></section>
<section class="panel controls"><div class="gaugehead"><span>弱い / 一点狙い</span><span id="percent">50%</span><span>強い / 広く狙う</span></div><div class="gauge"><div class="zones"></div><i class="needle" id="needle"></i></div><button id="throw" class="throw">この強さで投げる</button><button id="reset" class="reset">最初から試す</button><p class="hint">黄色は共通メンコ。赤枠はREDの差分、青枠はBLUEの差分です。めくれた後に効果が分かります。</p></section>
</main><script>
(()=>{"use strict";const $=s=>document.querySelector(s),board=$("#board"),msg=$("#message"),throwBtn=$("#throw"),needle=$("#needle"),pct=$("#percent");
const S={turn:"p",pHp:20,cHp:20,pStam:10,cStam:10,p:{atk:2,a:2,d:1},c:{atk:1,a:1,d:2},g:.5,phase:0,running:false,round:1};let cards=[],last=performance.now();const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rnd=(a,b)=>a+Math.random()*(b-a),own=()=>S.turn==="p"?"red":"blue",actor=()=>S.turn==="p"?"RED":"BLUE",target=()=>S.turn==="p"?"BLUE":"RED";
function breaths(n,col){return Array.from({length:5},(_,i)=>`<i class="pip ${i<Math.ceil(n/2)?col:""}"></i>`).join("")}function ui(){ $("#pHp").textContent=S.pHp;$("#cHp").textContent=S.cHp;$("#pStam").innerHTML=breaths(S.pStam,"red");$("#cStam").innerHTML=breaths(S.cStam,"blue");throwBtn.disabled=S.running||S.turn!=="p";throwBtn.textContent=S.turn==="p"?"この強さで投げる":"BLUEが投擲中…"}
function effect(c){if(c.team==="common")return c.type==="a"?"攻撃 +1":"防御 +1";const sign=c.team===own()?"＋":"－";return `${c.type==="a"?"攻撃":"防御"} ${sign}1`}
function deal(){const me=S.turn==="p"?S.p:S.c,op=S.turn==="p"?S.c:S.p,arr=[...Array(2).fill({team:"common",type:"a"}),...Array(2).fill({team:"common",type:"d"})];for(let i=0;i<me.a;i++)arr.push({team:own(),type:"a"});for(let i=0;i<me.d;i++)arr.push({team:own(),type:"d"});const enemy=own()==="red"?"blue":"red";for(let i=0;i<op.a;i++)arr.push({team:enemy,type:"a"});for(let i=0;i<op.d;i++)arr.push({team:enemy,type:"d"});cards=arr.map((c,i)=>({...c,x:rnd(16,84),y:rnd(16,84),rot:rnd(-26,26),z:i,flip:false}));for(let i=0;i<cards.length;i++)for(let j=0;j<i;j++)if(Math.hypot(cards[i].x-cards[j].x,cards[i].y-cards[j].y)<15){cards[i].x=clamp(cards[i].x+rnd(-15,15),11,89);cards[i].y=clamp(cards[i].y+rnd(-15,15),11,89)}draw();msg.innerHTML=`<strong>${actor()}の投擲</strong><span>盤面は毎回新しく配置。共通の攻撃2・防御2に、両者の差分メンコが混ざっています。</span>`;ui()}
function draw(){board.querySelectorAll(".card").forEach(x=>x.remove());cards.forEach(c=>{const e=document.createElement("div");e.className=`card ${c.team} ${c.flip?"flip":""}`;e.style.left=c.x+"%";e.style.top=c.y+"%";e.style.setProperty("--rot",c.rot+"deg");e.style.setProperty("--z",c.z+2);e.style.setProperty("--dx",rnd(-24,24)+"px");e.style.setProperty("--dy",rnd(-24,24)+"px");e.innerHTML=`<div class="shape"><div class="back">?</div><div class="face">${effect(c)}<small>${c.team==="common"?"共通":c.team.toUpperCase()+"差分"}</small></div></div>`;board.append(e)})}
function quality(g){return g<.18?.72:g<.40?1.02:g<.60?1.25:g<.68?1.38:g<.85?1.04:.82}
function throwIt(g){if(S.running)return;S.running=true;const me=S.turn==="p"?S.p:S.c,stam=S.turn==="p"?"pStam":"cStam",hp=S.turn==="p"?"cHp":"pHp",radius=17+g*49,q=quality(g);let a=0,d=0,flips=0;cards.forEach(c=>{const dist=Math.hypot(c.x-50,c.y-50),over=cards.filter(o=>o!==c&&o.z>c.z&&Math.hypot(o.x-c.x,o.y-c.y)<13).length;const chance=clamp((1-dist/radius)*.88*q*(1-over*.16),0,.88);if(Math.random()<chance){c.flip=true;flips++;const v=c.team==="common"?1:c.team===own()?1:-1;if(c.type==="a")a+=v;else d+=v}});a=Math.max(0,a);d=Math.max(0,d);const cost=Math.round(2+g*3+a*(1+me.atk*.42)),back=Math.min(5,Math.max(0,d)*2),damage=a?Math.max(1,a*me.atk):0;S[stam]=clamp(S[stam]-cost+back,0,10);S[hp]=Math.max(0,S[hp]-damage);draw();msg.innerHTML=`<strong>${actor()}：${flips}枚めくれた　攻撃 ${a} / 防御 ${d}</strong><span>${damage?`${target()}に ${damage} ダメージ。`:"攻撃は通らず。"}　息 ${cost} 消費${back?`、防御で ${back} 回復`:""}。</span>`;ui();setTimeout(()=>{if(S.pHp<=0||S.cHp<=0){msg.innerHTML=`<strong>${S.pHp<=0?"BLUE":"RED"}の勝ち</strong><span>最初から試す、で別の盤面を遊べます。</span>`;return}if(S[stam]===0){S[stam]=4;msg.innerHTML+=`<span>${actor()}はガス欠。次の投擲まで息を整えた。</span>`}S.turn=S.turn==="p"?"c":"p";S.running=false;S.round++;deal();if(S.turn==="c")setTimeout(()=>throwIt(rnd(.36,.79)),850)},900)}
function reset(){Object.assign(S,{turn:"p",pHp:20,cHp:20,pStam:10,cStam:10,running:false,round:1});deal()}throwBtn.onclick=()=>throwIt(S.g);board.onclick=()=>{if(S.turn==="p")throwIt(S.g)};$("#reset").onclick=reset;function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!S.running&&S.turn==="p"){S.phase=(S.phase+dt*.62)%1;S.g=(Math.sin(S.phase*Math.PI*2-Math.PI/2)+1)/2;needle.style.left=(S.g*100)+"%";pct.textContent=Math.round(S.g*100)+"%"}requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();
</script></body></html>
