<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MENKO ENDURANCE / GAMEPLAY INTEGRATION LAB</title>
  <style>
    @font-face {
      font-family: "Misaki";
      src: url("fonts/misaki_ttf_2021-05-05/misaki_gothic.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --red: rgb(255 0 0);
      --blue: rgb(0 0 255);
      --page: #101010;
      --panel: #222;
      --panel-border: #3b3b3b;
      --ink: #fff;
      --muted: #999;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Misaki", monospace;
      image-rendering: pixelated;
    }

    button, select { font: inherit; }

    .lab {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 16px 12px 42px;
    }

    .lab-title {
      margin: 0 0 5px;
      font-size: clamp(18px, 4vw, 25px);
      font-weight: normal;
    }

    .lab-copy {
      margin: 0 0 14px;
      color: #aaa;
      font-size: 13px;
      line-height: 1.6;
    }

    .lab-grid {
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(280px, 1fr);
      gap: 18px;
      align-items: start;
    }

    .game-screen {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 2px solid #363636;
      border-radius: 7px;
      background: #121212;
      box-shadow: 0 15px 45px #0008;
    }

    .game-content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 8px;
      padding: 10px 8px 12px;
    }

    .side-block { position: relative; }

    .side-label {
      display: flex;
      justify-content: space-between;
      padding: 0 3px 4px;
      color: #a8a8a8;
      font-size: 10px;
    }

    .red.side-block .side-label { flex-direction: row-reverse; }

    .status-group {
      position: relative;
      display: flex;
      align-items: flex-start;
      width: 100%;
      isolation: isolate;
    }

    .info-window {
      position: relative;
      z-index: 1;
      width: calc(100% - 90px);
      height: 108px;
      padding: 9px 13px 7px;
      border: 2px solid var(--panel-border);
      border-radius: 4px;
      background: var(--panel);
      box-shadow: inset 0 0 0 2px #292929;
    }

    .blue .info-window { padding-right: 25px; }
    .red .info-window { order: 2; margin-left: -22px; padding-left: 25px; }

    .portrait-window {
      --portrait-scale: 1.5;
      --portrait-offset-y: -20%;
      position: relative;
      z-index: 3;
      flex: 0 0 104px;
      width: 104px;
      height: 104px;
      overflow: hidden;
      border: 4px solid;
      border-radius: 4px;
      background: #fff;
    }

    .blue .portrait-window { order: 2; margin-left: -22px; border-color: var(--blue); }
    .red .portrait-window { order: 1; border-color: var(--red); }

    .portrait-layer {
      position: absolute;
      top: var(--portrait-offset-y);
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(var(--portrait-scale));
      transform-origin: 50% 0;
      pointer-events: none;
      user-select: none;
    }

    .hp-line, .stat-line {
      font-size: 18px;
      line-height: 1;
      white-space: nowrap;
    }

    .hp-rail {
      width: 100%;
      height: 20px;
      margin: 7px 0 9px;
      padding: 3px;
      border: 2px solid #fff;
      background: #111;
    }

    .hp-fill { height: 100%; transition: width 0ms linear; }
    .blue .hp-fill { background: var(--blue); }
    .red .hp-fill { background: var(--red); }

    .defense-line {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .strength-wrap { display: grid; gap: 4px; }

    .strength-caption {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
      color: #aaa;
      font-size: 10px;
    }

    .strength-bar {
      position: relative;
      width: 100%;
      height: 24px;
      border: 3px solid #fff;
      background: #151515;
    }

    .strength-bar::before {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      top: 50%;
      height: 4px;
      translate: 0 -50%;
      background: #555;
    }

    .strength-cursor {
      position: absolute;
      z-index: 2;
      top: 2px;
      left: 50%;
      width: 18px;
      height: 14px;
      translate: -50% 0;
      background: #fff;
      transition: left 180ms steps(4, jump-none);
    }

    .ring-area {
      position: relative;
      width: 100%;
      aspect-ratio: 420 / 410;
      overflow: hidden;
    }

    .ring-area svg,
    #menko-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .ring-area svg { z-index: 1; }
    #menko-stage { z-index: 2; pointer-events: none; }

    .status-group::after {
      content: "";
      position: absolute;
      z-index: 8;
      inset: 0;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
    }

    .status-group.feedback-red { animation: hit-shake 360ms steps(2, jump-none); }
    .status-group.feedback-red::after { animation: flash-red 360ms linear; }
    .status-group.feedback-white { animation: guard-shake 360ms steps(2, jump-none); }
    .status-group.feedback-white::after { animation: flash-white 360ms linear; }
    .status-group.feedback-soft::after { animation: flash-soft 360ms linear; }
    .status-group.feedback-red-double { animation: clone-shake 520ms steps(2, jump-none); }
    .status-group.feedback-red-double::after { animation: flash-red-double 520ms linear; }
    .status-group.feedback-white-double::after { animation: flash-white-double 520ms linear; }

    @keyframes hit-shake {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-4px, 1px); }
      40% { transform: translate(4px, -1px); }
      60% { transform: translate(-3px, 0); }
      80% { transform: translate(3px, 1px); }
    }

    @keyframes guard-shake {
      0%, 100% { transform: translate(0); }
      25% { transform: translate(-3px, 0); }
      50% { transform: translate(3px, 0); }
      75% { transform: translate(-2px, 0); }
    }

    @keyframes clone-shake {
      0%, 100% { transform: translate(0); }
      12% { transform: translate(-7px, 2px); }
      24% { transform: translate(7px, -2px); }
      38% { transform: translate(-6px, 1px); }
      52% { transform: translate(6px, -1px); }
      68% { transform: translate(-5px, 1px); }
      84% { transform: translate(4px, 0); }
    }

    @keyframes flash-red {
      0%, 100% { opacity: 0; }
      16%, 50% { opacity: .66; background: var(--red); }
    }

    @keyframes flash-white {
      0%, 100% { opacity: 0; }
      16%, 50% { opacity: .64; background: #fff; }
    }

    @keyframes flash-soft {
      0%, 100% { opacity: 0; }
      16%, 50% { opacity: .38; background: #fff; }
    }

    @keyframes flash-red-double {
      0%, 100% { opacity: 0; }
      8%, 24%, 56%, 73% { opacity: .72; background: var(--red); }
      34%, 44%, 82% { opacity: 0; }
    }

    @keyframes flash-white-double {
      0%, 100% { opacity: 0; }
      8%, 24%, 56%, 73% { opacity: .48; background: #fff; }
      34%, 44%, 82% { opacity: 0; }
    }

    .presentation-layer {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: none;
      pointer-events: none;
    }

    .presentation-layer.show { display: block; }

    .illustration-window {
      position: absolute;
      left: 6px;
      right: 6px;
      top: 158px;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border: 3px solid #fff;
      background: #050505;
    }

    .illustration-window img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .illustration-window img.mirrored { transform: scaleX(-1); }

    .message-window {
      position: absolute;
      left: 4px;
      right: 4px;
      top: 478px;
      display: none;
      min-height: 68px;
      padding: 10px 13px;
      border: 3px solid #fff;
      background: #050505;
      color: #fff;
      font-size: 17px;
      line-height: 1.45;
      white-space: pre-line;
    }

    .message-window.show { display: block; }
    .message-window.tall { min-height: 88px; }

    .frame-counter {
      position: absolute;
      right: 6px;
      bottom: 5px;
      padding: 3px 5px;
      background: #000c;
      font-size: 11px;
    }

    .controls {
      display: grid;
      gap: 11px;
    }

    .control-card {
      padding: 12px;
      border: 1px solid #353535;
      border-radius: 6px;
      background: #1a1a1a;
    }

    .control-card h2 {
      margin: 0 0 9px;
      font-size: 16px;
      font-weight: normal;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    label { display: grid; gap: 5px; color: #aaa; font-size: 12px; }

    select {
      width: 100%;
      min-height: 38px;
      padding: 6px 7px;
      border: 1px solid #4a4a4a;
      border-radius: 4px;
      background: #262626;
      color: #fff;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    button {
      min-height: 40px;
      padding: 7px 8px;
      border: 1px solid #4a4a4a;
      border-radius: 4px;
      background: #292929;
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { background: #343434; }
    button:active { translate: 0 1px; }
    button.primary { border-color: #888; background: #3c3c3c; }
    button:disabled { cursor: wait; opacity: .45; }

    .lab-status {
      margin: 0;
      padding: 10px;
      border-left: 4px solid #fff;
      background: #151515;
      color: #bbb;
      font-size: 13px;
      line-height: 1.55;
    }

    @media (max-width: 760px) {
      .lab-grid { grid-template-columns: 1fr; }
      .game-screen, .controls { width: 100%; max-width: 430px; margin-inline: auto; }
    }

    @media (max-width: 370px) {
      .portrait-window { flex-basis: 96px; width: 96px; height: 96px; }
      .info-window { height: 100px; }
      .hp-line, .stat-line { font-size: 16px; }
      .defense-line { font-size: 12px; }
      .illustration-window { top: 148px; }
      .message-window { top: 448px; font-size: 15px; }
    }
  </style>
</head>
<body>

    <h1 class="lab-title">GAMEPLAY INTEGRATION LAB</h1>
    <p class="lab-copy">完成済みの画面・メンコ・キャラクター・演出を一つの画面で確認します。</p>

    <div class="lab-grid">

                <path d="M72 54H348"/><path d="M72 64H348"/><path d="M72 74H348"/>
                <path d="M72 54V330"/><path d="M82 54V330"/><path d="M338 54V330"/><path d="M348 54V330"/>
              </g>

                  <path d="M72 82V41C72 36 88 36 88 41V82Z" fill="#aaa" stroke="none"/>

          <div class="side-block red" data-side="red">

  <script>
  (() => {
    const ASSET_ROOT = "assets/character_portrait_lab";
    const MOVE_ROOT = "assets/moves";
    const wait = ms => new Promise(resolve => window.setTimeout(resolve, ms));
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const expressionNames = ["normal", "attack", "damage"];
    const sideBlocks = Object.fromEntries(["red", "blue"].map(side => [side, document.querySelector(`[data-side="${side}"]`)]));
    const statusGroups = Object.fromEntries(["red", "blue"].map(side => [side, sideBlocks[side].querySelector(".status-group")]));
    const allActionControls = [...document.querySelectorAll("button, select")];
    const labStatus = document.getElementById("lab-status");
    const presentationLayer = document.getElementById("presentation-layer");
    const illustrationWindow = document.getElementById("illustration-window");
    const moveImage = document.getElementById("move-image");
    const frameCounter = document.getElementById("frame-counter");
    const messageWindow = document.getElementById("message-window");
    const powerSelect = document.getElementById("power-select");
    const flipSelect = document.getElementById("flip-select");
    const designSelect = document.getElementById("design-select");
    const initiativeSelect = document.getElementById("initiative-select");
    const eventSideSelect = document.getElementById("event-side-select");
    const strengthCursor = document.getElementById("strength-cursor");

    const faceSets = ["01", "02", "03"];
    const cpuHairs = ["hair_01", "hair_02", "hair_03", "hair_04", "hair_05", "hair_06", "hair_07"];
    const cpuCombos = cpuHairs.flatMap(hair => faceSets.map(faceSet => ({ hair, faceSet })));

    class ShuffleBag {
      constructor(values) { this.values = values.slice(); this.queue = []; this.last = null; }
      refill() {
        this.queue = this.values.slice();
        for (let index = this.queue.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [this.queue[index], this.queue[swapIndex]] = [this.queue[swapIndex], this.queue[index]];
        }
        const lastIndex = this.queue.length - 1;
        if (lastIndex > 0 && this.queue[lastIndex] === this.last) {
          [this.queue[0], this.queue[lastIndex]] = [this.queue[lastIndex], this.queue[0]];
        }
      }
      next() {
        if (this.queue.length === 0) this.refill();
        const value = this.queue.pop();
        this.last = value;
        return value;
      }
    }

    const cpuBag = new ShuffleBag(cpuCombos);
    const playerFaceSet = faceSets[Math.floor(Math.random() * faceSets.length)];
    const fighters = {
      red: { hair: "player", faceSet: playerFaceSet, expression: "normal", hp: 12, maxHp: 18, attack: 3, defenseNew: 1, defenseCarry: 1 },
      blue: { ...cpuBag.next(), expression: "normal", hp: 12, maxHp: 18, attack: 3, defenseNew: 1, defenseCarry: 1 }
    };

    let busy = false;
    let resetExpressionTimer = 0;

    function setBusy(value, statusText) {
      busy = value;
      allActionControls.forEach(control => { control.disabled = value; });
      if (statusText) labStatus.textContent = statusText;
    }

    function portraitPath(character, layer) {
      if (layer === "hair") return `${ASSET_ROOT}/hair_png/${character.hair}.png`;
      return `${ASSET_ROOT}/face_png/face_${character.faceSet}_${character.expression}.png`;
    }

    function renderFighter(side) {
      const fighter = fighters[side];
      const block = sideBlocks[side];
      block.querySelector(".hair-layer").src = portraitPath(fighter, "hair");
      block.querySelector(".face-layer").src = portraitPath(fighter, "face");
      block.querySelector(".identity").textContent = `${fighter.hair.toUpperCase()} / FACE ${fighter.faceSet}`;
      block.querySelector(".hp-current").textContent = String(Math.round(fighter.hp));
      block.querySelector(".hp-max").textContent = String(fighter.maxHp);
      block.querySelector(".hp-fill").style.width = `${clamp(fighter.hp / fighter.maxHp, 0, 1) * 100}%`;
      block.querySelector(".atk").textContent = String(fighter.attack);
      block.querySelector(".def-new").textContent = String(fighter.defenseNew);
      block.querySelector(".def-carry").textContent = String(fighter.defenseCarry);
      block.querySelector(".def-total").textContent = String(fighter.defenseNew + fighter.defenseCarry);
    }

    function renderAll() { renderFighter("red"); renderFighter("blue"); }

    function setExpression(side, expression) {
      if (!expressionNames.includes(expression)) return;
      fighters[side].expression = expression;
      renderFighter(side);
    }

    function scheduleNormalExpressions(delay = 1200) {
      window.clearTimeout(resetExpressionTimer);
      resetExpressionTimer = window.setTimeout(() => {
        setExpression("red", "normal");
        setExpression("blue", "normal");
      }, delay);
    }

    function restartFeedback(side, className, duration) {
      const group = statusGroups[side];
      group.classList.remove("feedback-red", "feedback-white", "feedback-soft", "feedback-red-double", "feedback-white-double");
      void group.offsetWidth;
      group.classList.add(className);
      window.setTimeout(() => group.classList.remove(className), duration + 30);
    }

    function animateHp(side, target, duration) {
      const fighter = fighters[side];
      const start = fighter.hp;
      const end = clamp(target, 0, fighter.maxHp);
      const startedAt = performance.now();
      return new Promise(resolve => {
        const tick = now => {
          const progress = clamp((now - startedAt) / duration, 0, 1);
          fighter.hp = start + (end - start) * progress;
          renderFighter(side);
          if (progress < 1) requestAnimationFrame(tick);
          else { fighter.hp = end; renderFighter(side); resolve(); }
        };
        requestAnimationFrame(tick);
      });
    }

    function showPresentation() {
      presentationLayer.classList.add("show");
      messageWindow.classList.remove("show", "tall");
    }

    function hidePresentation() {
      presentationLayer.classList.remove("show");
      messageWindow.classList.remove("show", "tall");
      illustrationWindow.style.display = "";
    }

    function showMessage(lines, tall = false) {
      messageWindow.textContent = lines.join("\n");
      messageWindow.classList.toggle("tall", tall);
      messageWindow.classList.add("show");
    }

    function opposite(side) { return side === "red" ? "blue" : "red"; }

    function frameFiles(stem, count) {
      return Array.from({ length: count }, (_, index) => `${MOVE_ROOT}/${stem}_${String(index + 1).padStart(2, "0")}.jpg`);
    }

    function preloadImages(files) {
      return Promise.all(files.map(src => new Promise(resolve => {
        const image = new Image();
        image.onload = resolve;
        image.onerror = resolve;
        image.src = src;
      })));
    }

    async function playIllustration({ files, mirrored = false, finalAction, lines, tall = false, alt = "演出イラスト" }) {
      await preloadImages(files);
      showPresentation();
      moveImage.alt = alt;
      moveImage.classList.toggle("mirrored", mirrored);

      for (let index = 0; index < files.length; index += 1) {
        moveImage.src = files[index];
        frameCounter.textContent = `${index + 1} / ${files.length}`;
        if (index < files.length - 1) await wait(320);
      }

      showMessage(lines, tall);
      scheduleNormalExpressions(1200);
      const feedback = finalAction();
      await Promise.all([feedback, wait(700)]);
      illustrationWindow.style.display = "none";
      await wait(500);
      hidePresentation();
    }

    async function playTechnique(attacker = "red", victim = opposite(attacker), damage = 2) {
      const attackerName = attacker.toUpperCase();
      const victimName = victim.toUpperCase();
      await playIllustration({
        files: frameFiles("move001_001", 4),

    async function playDefense(defender = "blue") {

          setExpression(defender, "normal");

    async function playCloneDamage(attacker = "red") {
      const victim = opposite(attacker);

      const victimName = victim.toUpperCase();

    async function playCloneHeal(side = "red") {
      const sideName = side.toUpperCase();

      const actualAmount = Math.min(amount, fighters[side].maxHp - fighters[side].hp);

      });

    const canvas = document.getElementById("menko-stage");
    const ctx = canvas.getContext("2d");
    let canvasWidth = 420;
    let canvasHeight = 410;
    let dpr = 1;
    let activeThrow = null;

    const presets = {
      tooWeak: { lift: 5, travel: 2, peak: 42 },
      weak: { lift: 8, travel: 4, peak: 58 },
      normal: { lift: 22, travel: 15, peak: 92 },
      just: { lift: 48, travel: 30, peak: 165 },
      strong: { lift: 63, travel: 43, peak: 215 },
      tooStrong: { lift: 76, travel: 62, peak: 250 }
    };
    const adjustedDuration = { tooWeak: .68, weak: .82, normal: .74, just: .66, strong: .58, tooStrong: .52 };

    function createAttackIcon() {
      const source = document.createElement("canvas");
      source.width = 96; source.height = 96;
      const sourceContext = source.getContext("2d", { willReadFrequently: true });
      sourceContext.font = '72px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      sourceContext.textAlign = "center"; sourceContext.textBaseline = "middle";
      sourceContext.fillText("🤜", 48, 51);
      const sample = document.createElement("canvas");
      sample.width = 24; sample.height = 24;
      const sampleContext = sample.getContext("2d", { willReadFrequently: true });
      sampleContext.drawImage(source, 0, 0, 24, 24);
      const pixels = sampleContext.getImageData(0, 0, 24, 24).data;
      const icon = document.createElement("canvas");
      icon.width = 24; icon.height = 24;
      const iconContext = icon.getContext("2d");
      for (let y = 0; y < 24; y += 1) {
        for (let x = 0; x < 24; x += 1) {
          const offset = (y * 24 + x) * 4;
          const alpha = pixels[offset + 3] / 255;
          if (alpha < .08) continue;
          const luminance = (pixels[offset] * .2126 + pixels[offset + 1] * .7152 + pixels[offset + 2] * .0722) / 255;
          iconContext.globalAlpha = alpha;
          iconContext.fillStyle = luminance >= .68 ? "#fff" : (luminance >= .3 ? "#969696" : "#000");
          iconContext.fillRect(x, y, 1, 1);
        }
      }
      iconContext.globalAlpha = 1;
      return icon;
    }

    function createDefenseIcon() {
      const whiteBounds = [[2,15],[1,16],[1,16],[1,16],[1,16],[1,16],[1,16],[1,16],[1,16],[1,16],[2,15],[3,14],[4,13],[5,12],[6,11],[7,10],[8,9]];
      const grayBounds = [null,null,[2,8],[2,8],[2,8],[2,8],[2,8],[2,8],[2,8],[2,8],[3,8],[4,8],[5,8],[6,8],[7,8]];
      const icon = document.createElement("canvas");
      icon.width = 18; icon.height = 18;
      const iconContext = icon.getContext("2d");
      whiteBounds.forEach((bounds, y) => { iconContext.fillStyle = "#fff"; iconContext.fillRect(bounds[0], y, bounds[1] - bounds[0] + 1, 1); });
      grayBounds.forEach((bounds, y) => { if (bounds) { iconContext.fillStyle = "#969696"; iconContext.fillRect(bounds[0], y, bounds[1] - bounds[0] + 1, 1); } });
      return icon;
    }

    const attackIcon = createAttackIcon();
    const defenseIcon = createDefenseIcon();

    function drawCloneFace(radius) {
      const scale = radius / 62;
      ctx.save();
      ctx.scale(scale, scale); ctx.translate(-90, -90);
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(90, 90, 38, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#000";
      ctx.fill(new Path2D("M64 68H72V64H80V72H72V76H64ZM100 64H108V68H116V76H108V72H100ZM68 76H74V80H80V88H74V92H68V88H74V84H68ZM106 76H112V84H106V88H112V92H106V88H100V80H106Z"));
      ctx.save(); ctx.translate(18, 21.2); ctx.scale(.8, .8);
      ctx.fill(new Path2D("M64 108H72V100H80V96H100V100H108V108H116V116H108V112H100V108H80V112H72V116H64Z"));
      ctx.restore(); ctx.restore();
    }

    function resolveDesign(side, requested) {
      if (requested === "clone") return { color: side === "red" ? "#f00" : "#00f", kind: "clone" };
      const kind = requested.toLowerCase().includes("defense") ? "defense" : "attack";
      const exclusive = requested.startsWith("exclusive");
      return { color: exclusive ? (side === "red" ? "#f00" : "#00f") : "rgb(40 40 40)", kind };
    }

    function drawFaceDesign(radius, spec, back) {
      const showIcon = spec.kind === "clone" ? back : !back;
      if (!showIcon) return;
      if (spec.kind === "clone") { drawCloneFace(radius); return; }
      const icon = spec.kind === "attack" ? attackIcon : defenseIcon;
      const size = spec.kind === "attack" ? radius * 1.18 : radius * 1.02;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(icon, -size / 2, -size / 2, size, size);
    }

    function animationValues(settings) {
      const preset = presets[settings.power];
      const lowPowerScale = settings.power === "tooWeak" || settings.power === "weak" ? .55 : 1;
      const highPowerLift = ({ strong: 1.15, tooStrong: 1.25 }[settings.power] || 1);
      return {
        ...preset,
        flip: settings.flip,
        lift: preset.lift * 1.25 * lowPowerScale * highPowerLift,
        travel: settings.power === "weak" ? 0 : preset.travel * lowPowerScale,
        duration: adjustedDuration[settings.power] * 1.05
      };
    }

    function stateAt(settings, elapsed) {
      const values = animationValues(settings);
      const progress = clamp(elapsed / values.duration, 0, 1);
      const arch = Math.sin(Math.PI * progress);
      let z = values.lift * Math.pow(Math.max(0, arch), .62);
      const x = values.travel * (1 - Math.pow(1 - progress, 3));
      const rotationExponent = ({ strong: .86, tooStrong: .78 }[settings.power] || 1);
      const rotationProgress = Math.pow(progress, rotationExponent);
      const ease = value => value * value * (3 - 2 * value);
      const adjustedFlip = values.flip && settings.power !== "tooWeak";
      let tilt;

      if (settings.power === "strong" || settings.power === "tooStrong") {
        const contactProgress = settings.power === "strong" ? .72 : .66;
        if (progress < contactProgress) {
          const local = progress / contactProgress;
          tilt = Math.PI * 1.5 * ease(local);
          z = values.lift * Math.pow(Math.max(0, Math.sin(Math.PI * local)), .62);
        } else {
          const local = (progress - contactProgress) / (1 - contactProgress);
          const finalTilt = adjustedFlip ? Math.PI : Math.PI * 2;
          tilt = Math.PI * 1.5 + (finalTilt - Math.PI * 1.5) * ease(local);
          const bounceHeight = settings.power === "strong" ? 8 : 13;
          z = bounceHeight * Math.pow(Math.max(0, Math.sin(Math.PI * local)), .72);
        }
      } else if (settings.power === "weak") {
        z = 0;
        const riseEnd = .56;
        const holdEnd = .68;
        if (progress < riseEnd) tilt = Math.PI * .5 * ease(progress / riseEnd);
        else if (progress < holdEnd) tilt = Math.PI * .5;
        else {
          const local = (progress - holdEnd) / (1 - holdEnd);
          const finalTilt = adjustedFlip ? Math.PI : 0;
          tilt = Math.PI * .5 + (finalTilt - Math.PI * .5) * ease(local);
        }
      } else if (adjustedFlip) {
        const slow = clamp((1.75 - 1) * .90, 0, .88);
        const wave = Math.PI * 2;
        const angleProgress = rotationProgress + slow / wave * Math.sin(wave * rotationProgress);
        tilt = Math.PI * angleProgress;
      } else if (settings.power === "tooWeak") {
        const peak = 12 * Math.PI / 180;
        if (progress < .32) tilt = peak * ease(progress / .32);
        else if (progress < .42) tilt = peak;
        else tilt = peak * (1 - ease((progress - .42) / .58));
      } else if (settings.power === "just") {
        const slow = clamp((1.75 - 1) * .52, 0, .55);
        const wave = Math.PI * 4;
        tilt = Math.PI * 2 * (progress + slow / wave * Math.sin(wave * progress));
      } else {
        const peak = 135 * Math.PI / 180;
        if (progress < .52) tilt = peak * ease(progress / .52);
        else tilt = peak * (1 - ease((progress - .52) / .48));
      }

      const rollTarget = adjustedFlip ? ({ just: 0, strong: Math.PI / 7.2, tooStrong: Math.PI / 3.3 }[settings.power] || 0) : 0;
      const rollEase = rotationProgress * rotationProgress * (3 - 2 * rotationProgress);
      return { values, progress, z, x, tilt, roll: rollTarget * rollEase, done: progress >= 1 };
    }

    function roundedPath(radius) {
      const corner = radius * .10;
      ctx.beginPath();
      ctx.moveTo(-radius + corner, -radius); ctx.lineTo(radius - corner, -radius); ctx.lineTo(radius, -radius + corner);
      ctx.lineTo(radius, radius - corner); ctx.lineTo(radius - corner, radius); ctx.lineTo(-radius + corner, radius);
      ctx.lineTo(-radius, radius - corner); ctx.lineTo(-radius, -radius + corner); ctx.closePath();
    }

    function drawFlatMenko(x, y, radius, rotation, spec) {
      ctx.save();
      ctx.globalAlpha = .22; ctx.fillStyle = "#fff"; ctx.translate(x + 6, y + 7); ctx.rotate(rotation);
      ctx.beginPath(); ctx.roundRect(-radius, -radius * .72, radius * 2, radius * 1.44, 4); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
      roundedPath(radius); ctx.fillStyle = spec.color; ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(-radius * .82, -radius * .82); ctx.lineTo(0, 0); ctx.lineTo(radius * .82, -radius * .82);
      ctx.moveTo(-radius * .82, radius * .82); ctx.lineTo(0, 0); ctx.lineTo(radius * .82, radius * .82); ctx.stroke();
      if (spec.kind !== "clone") drawFaceDesign(radius, spec, false);
      ctx.restore();
    }

    function drawAnimatedMenko(settings, elapsed) {
      const state = stateAt(settings, elapsed);
      const radius = 38;
      const direction = settings.side === "red" ? 1 : -1;
      const x = 210 + direction * state.x;
      const ground = 224;
      const perspectiveReference = presets.just.lift * 1.25;
      const heightRatio = clamp(state.z / perspectiveReference, 0, 1);
      const shadowScale = .70 + .30 * (1 - heightRatio);
      const cardScale = 1 + heightRatio * .30;
      const shadowOffsetX = 8 + heightRatio * 10;
      const shadowOffsetY = 7 + heightRatio * 7;
      const hideWeakShadow = settings.power === "weak";

      ctx.save();
      ctx.globalAlpha = hideWeakShadow ? 0 : .30;
      ctx.translate(x + shadowOffsetX, ground + shadowOffsetY);
      ctx.rotate(direction * (.08 * Math.sin(Math.PI * state.progress) + state.roll));
      ctx.scale(shadowScale, shadowScale);
      ctx.scale(1, .18 + .82 * Math.abs(Math.cos(state.tilt)));
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.roundRect(-radius * .78, -radius * .58, radius * 1.56, radius * 1.16, radius * .10); ctx.fill();
      ctx.restore();

      if (settings.power === "weak") {
        const upright = Math.abs(Math.sin(state.tilt));
        if (upright > .01) {
          ctx.save(); ctx.globalAlpha = .30 * Math.pow(upright, .72); ctx.fillStyle = "#777";
          ctx.translate(x, ground - radius * cardScale + radius * cardScale * upright + 2);
          ctx.fillRect(-radius * cardScale, -radius * cardScale * upright, radius * cardScale * 2, radius * cardScale * upright * 2);
          ctx.restore();
        }
      }

      const spec = resolveDesign(settings.side, settings.design);
      const cosine = Math.cos(state.tilt);
      const pivotY = settings.power === "weak" ? -radius : 0;
      const halfDepth = 2.25;
      const camera = 420;
      const corner = radius * .10;
      const outline = [[-radius+corner,-radius],[radius-corner,-radius],[radius,-radius+corner],[radius,radius-corner],[radius-corner,radius],[-radius+corner,radius],[-radius,radius-corner],[-radius,-radius+corner]];
      const project = (px, py, pz) => {
        const localY = py - pivotY;
        const rotatedY = localY * cosine - pz * Math.sin(state.tilt) + pivotY;
        const rotatedZ = localY * Math.sin(state.tilt) + pz * cosine;
        const perspective = camera / (camera - rotatedZ);
        return { x: px * perspective, y: rotatedY * perspective, z: rotatedZ, k: perspective };
      };
      const plane = z => outline.map(([px, py]) => project(px, py, z));
      const front = plane(halfDepth);
      const rear = plane(-halfDepth);
      const polygon = points => {
        ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
        for (let index = 1; index < points.length; index += 1) ctx.lineTo(points[index].x, points[index].y);
        ctx.closePath();
      };

      ctx.save();
      ctx.translate(x, ground - state.z);
      ctx.rotate(direction * (.08 * Math.sin(Math.PI * state.progress) + state.roll));
      ctx.scale(cardScale, cardScale);
      const sides = outline.map((_, index) => {
        const next = (index + 1) % outline.length;
        const points = [front[index], front[next], rear[next], rear[index]];
        return { points, z: points.reduce((sum, point) => sum + point.z, 0) / 4, index };
      }).sort((a, b) => a.z - b.z);
      sides.forEach(side => {
        polygon(side.points);
        const shade = Math.round(255 * Math.min(.92, .68 + (side.index % 4) * .055));
        ctx.fillStyle = `rgb(${shade},${shade},${shade})`; ctx.strokeStyle = "#777"; ctx.lineWidth = .8; ctx.fill(); ctx.stroke();
      });
      const back = cosine < 0;
      const face = back ? rear : front;
      const visibleZ = back ? -halfDepth : halfDepth;
      polygon(face); ctx.fillStyle = spec.color; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5 + 2.5 * Math.min(1, Math.abs(cosine) * 3); ctx.fill(); ctx.stroke();
      const center = project(0, 0, visibleZ);
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath();
      [0,1,4,5].forEach(index => { ctx.moveTo(face[index].x, face[index].y); ctx.lineTo(center.x, center.y); }); ctx.stroke();
      ctx.save(); ctx.translate(center.x, center.y); ctx.scale(center.k, Math.max(.055, Math.abs(cosine)) * center.k); drawFaceDesign(radius, spec, back); ctx.restore();
      ctx.restore();
      return state;
    }

    const fieldCards = [
      { x: 128, y: 130, r: 23, a: -.18, spec: { color: "rgb(40 40 40)", kind: "attack" } },
      { x: 198, y: 117, r: 23, a: .10, spec: { color: "#00f", kind: "defense" } },
      { x: 285, y: 137, r: 23, a: -.08, spec: { color: "rgb(40 40 40)", kind: "defense" } },
      { x: 133, y: 286, r: 23, a: .15, spec: { color: "#f00", kind: "clone" } },
      { x: 282, y: 278, r: 23, a: -.13, spec: { color: "#00f", kind: "clone" } }
    ];

    function resizeCanvas() {
      const bounds = canvas.getBoundingClientRect();
      dpr = Math.min(2, window.devicePixelRatio || 1);
      canvasWidth = bounds.width; canvasHeight = bounds.height;
      canvas.width = Math.round(canvasWidth * dpr); canvas.height = Math.round(canvasHeight * dpr);
      ctx.setTransform(dpr * canvasWidth / 420, 0, 0, dpr * canvasHeight / 410, 0, 0);
    }

    function drawCanvas(now) {
      ctx.clearRect(0, 0, 420, 410);
      fieldCards.forEach(card => drawFlatMenko(card.x, card.y, card.r, card.a, card.spec));
      if (activeThrow) {
        const elapsed = (now - activeThrow.startedAt) / 1000;
        const state = drawAnimatedMenko(activeThrow.settings, elapsed);
        if (state.done) {
          const resolve = activeThrow.resolve;
          activeThrow = null;
          resolve();
        }
      }
      requestAnimationFrame(drawCanvas);
    }

    function cursorPosition(power) {
      return ({ tooWeak: 5, weak: 20, normal: 40, just: 54, strong: 76, tooStrong: 94 })[power];
    }

    function selectedSettings(side) {
      return {
        side,
        power: powerSelect.value,
        flip: flipSelect.value === "yes",
        design: designSelect.value
      };
    }

    function playThrow(side) {
      if (activeThrow) return Promise.resolve();
      const settings = selectedSettings(side);
      strengthCursor.style.left = `${cursorPosition(settings.power)}%`;
      return new Promise(resolve => { activeThrow = { settings, startedAt: performance.now(), resolve }; });
    }

    async function runAction(statusText, action) {
      if (busy) return;
      setBusy(true, statusText);
      try { await action(); }
      finally { setBusy(false, "確認が終わりました。別の演出も続けて試せます。"); }
    }

    function resetState() {
      window.clearTimeout(resetExpressionTimer);
      hidePresentation();
      fighters.red.hp = 12; fighters.blue.hp = 12;
      fighters.red.defenseNew = 1; fighters.red.defenseCarry = 1;
      fighters.blue.defenseNew = 1; fighters.blue.defenseCarry = 1;
      fighters.red.expression = "normal"; fighters.blue.expression = "normal";
      renderAll();
      labStatus.textContent = "初期状態へ戻しました。";
    }

    powerSelect.addEventListener("change", () => { strengthCursor.style.left = `${cursorPosition(powerSelect.value)}%`; });
    document.getElementById("red-throw").addEventListener("click", () => runAction("REDの投擲を再生しています。", () => playThrow("red")));
    document.getElementById("blue-throw").addEventListener("click", () => runAction("BLUEの投擲を再生しています。", () => playThrow("blue")));
    document.getElementById("round-play").addEventListener("click", () => runAction("両者の投擲から攻撃演出まで再生しています。", async () => {
      const first = initiativeSelect.value;
      const second = opposite(first);
      await playThrow(first); await wait(220); await playThrow(second); await wait(260); await playTechnique(first, second, 2);
    }));
    document.getElementById("damage-play").addEventListener("click", () => {
      const attacker = eventSideSelect.value;
      runAction(`${attacker.toUpperCase()}の通常攻撃を再生しています。`, () => playTechnique(attacker, opposite(attacker), 2));
    });
    document.getElementById("defense-play").addEventListener("click", () => {
      const defender = eventSideSelect.value;
      runAction(`${defender.toUpperCase()}の完全防御を再生しています。`, () => playDefense(defender));
    });
    document.getElementById("no-attack-play").addEventListener("click", () => {
      const first = initiativeSelect.value;
      runAction(`${first.toUpperCase()}先攻の攻撃なし演出を再生しています。`, () => playNoAttack(first));
    });
    document.getElementById("clone-damage-play").addEventListener("click", () => {
      const attacker = eventSideSelect.value;
      runAction(`${attacker.toUpperCase()}の分身最大ダメージを再生しています。`, () => playCloneDamage(attacker));
    });
    document.getElementById("clone-heal-play").addEventListener("click", () => {
      const side = eventSideSelect.value;
      runAction(`${side.toUpperCase()}の分身回復を再生しています。`, () => playCloneHeal(side));
    });
    document.getElementById("new-opponent").addEventListener("click", () => {
      if (busy) return;
      const next = cpuBag.next();
      fighters.blue.hair = next.hair; fighters.blue.faceSet = next.faceSet; fighters.blue.expression = "normal";
      renderFighter("blue");
      labStatus.textContent = "BLUEの組み合わせを変更しました。REDの顔セットは変わりません。";
    });
    document.getElementById("reset-play").addEventListener("click", () => { if (!busy) resetState(); });

    window.addEventListener("resize", resizeCanvas);
    renderAll();
    strengthCursor.style.left = `${cursorPosition(powerSelect.value)}%`;
    resizeCanvas();
    requestAnimationFrame(drawCanvas);
  })();
  </script>
</body>
</html>
