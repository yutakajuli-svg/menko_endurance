<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MENKO STAMINA DUEL LAB</title><style>
:root{color-scheme:dark;--bg:#0d1015;--panel:#171c25;--line:#536173;--text:#eff4fb;--muted:#a7b3c2;--red:#e94e55;--blue:#5797e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,Consolas,monospace}main{width:min(430px,calc(100% - 16px));margin:10px auto 36px}h1{font-size:18px;margin:0 0 5px}.lead{font:11px/1.55 ui-monospace,Consolas,monospace;color:var(--muted);margin:0 0 9px}.row{display:flex;gap:7px;margin-bottom:8px}.row button{flex:1;padding:8px 5px;border:1px solid #637188;background:#111722;color:#fff;font:11px ui-monospace,Consolas,monospace}.gaugebox,.hud,.logbox{border:1px solid var(--line);background:var(--panel);padding:8px;margin-bottom:8px}.ghead{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}.gauge{height:24px;background:#080a0f;border:2px solid #eaf0fa;position:relative}.gauge:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#596573,#909aa5,#c8cdd3,#909aa5,#596573);opacity:.35}.cap{position:absolute;top:0;bottom:0;left:0;border-right:2px dashed #f5d066;background:#f5d06622}.needle{position:absolute;top:-4px;bottom:-4px;width:4px;background:#fff;transform:translateX(-2px);box-shadow:0 0 0 1px #000}.labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:4px}.hud{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fighter{font-size:10px;color:var(--muted)}.fighter b{display:block;color:var(--text);font-size:11px}.heart{position:relative;display:inline-block;font:30px/1 Arial;color:#3f4754;letter-spacing:-4px;vertical-align:middle;width:39px;height:31px;overflow:hidden}.heart i{position:absolute;left:0;top:0;color:#eb4d58;font-style:normal;overflow:hidden;white-space:nowrap}.blue .heart i{color:#5797e8}.st{font-size:10px}.stage{position:relative;border:1px solid var(--line);background:#111722}.stage canvas{display:block;width:100%;aspect-ratio:1}.stage button{position:absolute;inset:0;border:0;background:transparent;color:transparent;width:100%;cursor:pointer}.stage button:disabled{cursor:default}.status{min-height:52px;border:1px solid var(--line);border-top:0;background:var(--panel);padding:8px 10px;line-height:1.5}.status strong{font-size:13px}.status span{display:block;font-size:10px;color:var(--muted)}.loghead{display:flex;justify-content:space-between;font-size:11px}.loghead button{border:1px solid #637188;background:#111722;color:#fff;font:10px ui-monospace,Consolas,monospace;padding:4px 7px}textarea{width:100%;height:166px;margin-top:7px;background:#0a0d12;color:#d9e4f1;border:1px solid #414e60;padding:7px;font:10px/1.4 ui-monospace,Consolas,monospace;resize:vertical}</style></head><body><main>
<h1>MENKO STAMINA DUEL LAB</h1><p class="lead">Standard-weight duel. Strong throws consume stamina; a weak throw can maintain it. Main game remains untouched.</p><div class="row"><button id="reset">New match</button><button id="copy">Copy log</button><button id="fixed">Fixed: OFF</button></div>
<section class="gaugebox"><div class="ghead"><span id="turn">ROUND 1 / RED</span><span id="value">0% / cap 100%</span></div><div class="gauge"><i class="cap" id="cap"></i><i class="needle" id="needle"></i></div><div class="labels"><span>light / recover</span><span>heavy / consume</span></div></section>
<section class="hud"><div class="fighter"><b>RED / PLAYER</b><span class="heart">♥<i id="redHeart">♥</i></span> <span class="st" id="redSt">100 / 100</span></div><div class="fighter blue"><b>BLUE / CPU</b><span class="heart">♥<i id="blueHeart">♥</i></span> <span class="st" id="blueSt">100 / 100</span></div></section>
<section class="stage"><canvas id="c" width="430" height="430"></canvas><button id="throw">Throw</button></section><div class="status" id="status"></div><section class="logbox"><div class="loghead"><b>Paste-ready log</b><button id="copy2">Copy</button></div><textarea id="log" readonly></textarea></section>
</main><script>(()=>{"use strict";const $=x=>document.getElementById(x),cv=$("c"),x=cv.getContext("2d"),btn=$("throw"),SIZE=430,R=29,MAX=210,clamp=(n,a,b)=>Math.max(a,Math.min(b,n));let cards=[],phase=0,last=performance.now(),turn="red",round=1,running=false,started=0,aim={x:215,y:215},action=null,flips={},fixed=false,logs=[],stamina={red:100,blue:100},mood=1;const randGen=s=>{let a=s>>>0;return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}},normal=(r,sd)=>Math.sqrt(-2*Math.log(Math.max(.0001,r())))*Math.cos(6.283*r())*sd,smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)},powerCap=a=>stamina[a]<=0?.22:Math.max(.22,stamina[a]/100),throwCost=p=>3+25*Math.pow(p,1.55),recover=8;
function cardPath(r){const q=r*.14;x.beginPath();x.moveTo(-r+q,-r);x.lineTo(r-q,-r);x.lineTo(r,-r+q);x.lineTo(r,r-q);x.lineTo(r-q,r);x.lineTo(-r+q,r);x.lineTo(-r,r-q);x.closePath()}function drawCard(c){const z=c.z||0,flat=Math.max(.1,Math.abs(Math.cos(c.tilt||0)));x.save();x.globalAlpha=.3;x.translate(c.x+5,c.y+8);x.rotate(c.rot);x.scale(1,.86);x.fillStyle="#000";cardPath(R);x.fill();x.restore();x.save();x.translate(c.x,c.y-z);x.rotate(c.rot);x.scale(1,flat);x.fillStyle=c.face?"#26313c":"#30353d";cardPath(R);x.fill();x.strokeStyle="#edf3fb";x.lineWidth=2;x.stroke();if(!c.face){x.strokeStyle=c.type?"#e94e55":"#5797e8";x.lineWidth=4;x.beginPath();if(c.type){x.moveTo(-10,0);x.lineTo(9,0);x.moveTo(2,-7);x.lineTo(9,0);x.lineTo(2,7)}else x.arc(0,0,7,0,6.283);x.stroke()}x.restore()}function draw(){x.clearRect(0,0,SIZE,SIZE);x.fillStyle="#252c35";x.fillRect(6,6,418,418);x.strokeStyle="#7e8997";x.lineWidth=2;x.strokeRect(6,6,418,418);if(action){x.save();x.setLineDash([5,5]);x.strokeStyle=action.actor==="red"?"#e94e55":"#5797e8";x.beginPath();x.arc(action.aim.x,action.aim.y,action.radius,0,6.283);x.stroke();x.restore()}const p=action?action.aim:aim;x.strokeStyle="#fff";x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,13,0,6.283);x.moveTo(p.x-20,p.y);x.lineTo(p.x+20,p.y);x.moveTo(p.x,p.y-20);x.lineTo(p.x,p.y+20);x.stroke();cards.forEach(drawCard);x.fillStyle="#bdc9d9";x.font="11px monospace";x.fillText("TAP TO THROW",14,23)}function board(){const r=randGen(fixed?281828:Math.floor(Math.random()*2**31)),a=[];for(let i=0;i<10;i++){let p,n=0;do{p={x:42+r()*346,y:42+r()*346};n++}while(n<200&&a.some(c=>Math.hypot(c.x-p.x,c.y-p.y)<R*1.72));a.push({x:p.x,y:p.y,rot:(r()-.5)*1.1,w:.9+r()*.25,type:i%2,face:0,z:0,tilt:0,anim:null})}return a}function showLog(){$("log").value=logs.join("\n");$("log").scrollTop=999999}function hearts(){for(const a of ["red","blue"]){$(a+"Heart").style.width=`${stamina[a]}%`;$(a+"St").textContent=`${Math.round(stamina[a])} / 100`}}function ui(){$("turn").textContent=`ROUND ${round} / ${turn.toUpperCase()}`;btn.disabled=running||turn!=="red";btn.textContent=turn==="red"?"Throw":"BLUE thinking...";hearts()}function setMood(){mood=.84+Math.random()*.32}function reset(){cards=board();turn="red";round=1;running=false;action=null;flips={};aim={x:215,y:215};stamina={red:100,blue:100};setMood();logs=["===== STAMINA DUEL LAB =====","Standard weight=1.00 / board=430px / MENKO=58px","cost = 3 + 25 * power^1.55 ; natural recovery = +8","at 0 stamina: power cap 22% and flip chance penalty",""];showLog();$("status").innerHTML="<strong>RED THROW</strong><span>Weak throws preserve stamina. Strong throws create a larger impact but drain it.</span>";ui()}
function cpuAim(){let best=cards[0],score=-1;for(const c of cards){let s=0;for(const o of cards)s+=Math.exp(-Math.hypot(c.x-o.x,c.y-o.y)/76);if(s>score){score=s;best=c}}return best?{x:best.x,y:best.y}:{x:215,y:215}}function launch(actor,selected,p){if(running)return;const before=stamina[actor],cap=powerCap(actor),intended=clamp(selected,0,cap),r=randGen((fixed?314159:Date.now())^round^(actor==="red"?31:79)),e=normal(r,actor==="red"?.022:.024),actual=clamp(intended+e,0,cap),power=.56+.74*actual,radius=MAX*(.30+.60*Math.pow(actual,.78)),fatigue=before<=0?.65:1,a={actor,aim:p,selected,intended,actual,e,power,radius,before,cap,fatigue,flipped:0,moved:0,rows:[]};for(let i=cards.length-1;i>=0;i--){const c=cards[i],d=Math.hypot(c.x-p.x,c.y-p.y),raw=clamp(1-d/radius,0,1),radial=raw>0?.10+.90*Math.sqrt(raw):0,direct=clamp(1-d/(R+20),0,1),imp=power*radial/c.w;if(radial<=0||imp<.18){a.rows.push({i,d,radial,imp,chance:0,flip:false});continue}const motion=smooth((imp-.18)/.92),chance=clamp((.04+.52*motion+direct*.14)*fatigue,.01,.76),flip=r()<chance,ux=(c.x-p.x)/Math.max(1,d),uy=(c.y-p.y)/Math.max(1,d),side=r()>.5?1:-1;c.anim={sx:c.x,sy:c.y,ex:c.x+ux*(10+42*motion)+(-uy)*side*8,ey:c.y+uy*(10+42*motion)+ux*side*8,lift:(10+78*Math.pow(actual,1.1))*(.25+.75*motion),flip,motion};a.rows.push({i,d,radial,imp,chance,flip});a.moved++;if(flip)a.flipped++}action=a;running=true;started=performance.now();$("status").innerHTML=`<strong>${actor.toUpperCase()} THROW</strong><span>${Math.round(actual*100)}% power / stamina cap ${Math.round(cap*100)}% / before ${Math.round(before)}</span>`;ui()}
function complete(){running=false;const a=action,cost=4+45*Math.pow(a.actual,1.4),recovery=a.actual<=.28?12:0,after=clamp(a.before-cost+recovery,0,100);stamina[a.actor]=after;flips[a.actor]=a.flipped;logs.push(`----- ROUND ${round} / ${a.actor.toUpperCase()} -----`,`stamina: ${a.before.toFixed(1)} -> ${after.toFixed(1)} | cap=${(a.cap*100).toFixed(1)}% | cost=${cost.toFixed(1)} | recovery=+${recovery}`,`selected=${(a.selected*100).toFixed(1)} intended=${(a.intended*100).toFixed(1)} actual=${(a.actual*100).toFixed(1)} error=${(a.e*100).toFixed(1)} radius=${a.radius.toFixed(1)}px`,...a.rows.map(q=>`card${String(q.i+1).padStart(2,"0")} dist=${q.d.toFixed(1)} radial=${(q.radial*100).toFixed(1)} final=${(q.chance*100).toFixed(1)} result=${q.flip?"FLIP":"NO"}`),`summary: moved=${a.moved} flips=${a.flipped}`,"");showLog();if(a.actor==="red"){turn="blue";ui();setTimeout(()=>{const q=clamp((.50+normal(randGen(Date.now()),.12))*powerCap("blue"),.05,powerCap("blue"));launch("blue",q,cpuAim())},550)}else{logs.push(`===== ROUND ${round} RESULT: RED ${flips.red||0} / BLUE ${flips.blue||0} =====`,"");showLog();$("status").innerHTML=`<strong>ROUND ${round}: RED ${flips.red||0} / BLUE ${flips.blue||0}</strong><span>Next board. Watch the heart and compare power choices.</span>`;round++;cards=board();turn="red";flips={};setMood();ui()}}
function update(now){if(!running)return;let done=true;for(const c of cards){if(!c.anim)continue;const p=clamp((now-started)/690,0,1),q=1-(1-p)**3;c.x=c.anim.sx+(c.anim.ex-c.anim.sx)*q;c.y=c.anim.sy+(c.anim.ey-c.anim.sy)*q;c.z=c.anim.lift*Math.sin(Math.PI*p);c.tilt=c.anim.motion*1.7*q;if(p<1)done=false;else{c.face=c.anim.flip?1:0;c.z=0;c.anim=null}}if(done)complete()}function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const c=powerCap("red");if(!running&&turn==="red")phase=(phase+dt*.52*mood*(1+(1-stamina.red/100)*.8))%1;const raw=(Math.sin(phase*6.283-1.571)+1)/2,g=raw*c;$("needle").style.left=`${g*100}%`;$("cap").style.width=`${c*100}%`;$("value").textContent=`${Math.round(g*100)}% / cap ${Math.round(c*100)}%`;update(now);draw();requestAnimationFrame(frame)}function setAim(e){const b=cv.getBoundingClientRect();aim={x:clamp((e.clientX-b.left)*SIZE/b.width,6,424),y:clamp((e.clientY-b.top)*SIZE/b.width,6,424)}}btn.onpointermove=e=>{if(!running&&turn==="red")setAim(e)};btn.onclick=e=>{setAim(e);const raw=(Math.sin(phase*6.283-1.571)+1)/2;launch("red",raw*powerCap("red"),aim)};$("reset").onclick=reset;$("fixed").onclick=()=>{fixed=!fixed;$("fixed").textContent=`Fixed: ${fixed?"ON":"OFF"}`;reset()};const copy=async()=>{try{await navigator.clipboard.writeText($("log").value)}catch{$("log").focus();$("log").select();document.execCommand("copy")}};$("copy").onclick=copy;$("copy2").onclick=copy;reset();requestAnimationFrame(frame)})();</script></body></html>
