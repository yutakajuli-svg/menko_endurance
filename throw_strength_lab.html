<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENKO THROW FEEL LAB</title>
<style>
  :root{color-scheme:dark;--bg:#0d0d0d;--panel:#171717;--line:#555;--text:#f4f4f4;--muted:#aaa}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,Consolas,"Noto Sans JP",monospace}
  main{width:min(760px,calc(100% - 20px));margin:14px auto 40px}h1{font-size:clamp(19px,5vw,28px);margin:0 0 5px}.lead{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.7}
  .toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}.toolbar label{display:grid;gap:5px;color:var(--muted);font-size:12px}.toolbar select,.toolbar button{background:#111;color:#fff;border:1px solid #777;padding:8px 10px;font:inherit}.toolbar button{cursor:pointer}.toolbar .random-mode{display:flex;align-items:center;gap:7px;padding:8px 0;color:#ddd}
  .gauge-box{border:1px solid #666;background:#151515;padding:8px;margin-bottom:8px}.gauge-label{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-bottom:5px}.gauge{height:23px;border:2px solid #eee;background:#080808;position:relative;overflow:hidden}.zones{position:absolute;inset:0;display:flex;opacity:.24}.zones i:nth-child(1){width:12.5%;background:#666}.zones i:nth-child(2){width:17.5%;background:#999}.zones i:nth-child(3){width:22.5%;background:#ddd}.zones i:nth-child(4){width:10%;background:#fff}.zones i:nth-child(5){width:22.5%;background:#bbb}.zones i:nth-child(6){width:15%;background:#777}.needle{position:absolute;top:-3px;bottom:-3px;width:4px;background:#fff;box-shadow:0 0 0 1px #111;transform:translateX(-2px)}
  .stage{border:1px solid #666;background:#111;position:relative;touch-action:manipulation}.stage canvas{display:block;width:100%;aspect-ratio:1/1}.stage button{position:absolute;inset:0;border:0;background:transparent;color:transparent;cursor:pointer}.stage button:disabled{cursor:default}.status{min-height:54px;border:1px solid #555;border-top:0;background:#171717;padding:9px 11px;line-height:1.55}.status strong{font-size:16px}.status span{display:block;color:var(--muted);font-size:12px}.legend{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:8px;color:var(--muted);font-size:10px;text-align:center}.legend b{font-weight:400;padding-top:4px;border-top:3px solid #777}.legend b:nth-child(4){color:#fff;border-color:#fff}
  @media(max-width:520px){.toolbar{grid-template-columns:1fr}.toolbar button{width:100%}.legend{font-size:8px}}
</style>
</head>
<body>
<main>
  <h1>投擲感ラボ</h1>
  <p class="lead">盤面と中央着弾は同じです。実戦用では結果の抽選だけが毎回変わり、比較用では固定できます。</p>
  <div class="toolbar">
    <label>場の通常MENKO枚数
      <select id="density"><option value="6">6枚</option><option value="10" selected>10枚</option><option value="14">14枚</option></select>
    </label>
    <label class="random-mode"><input id="fixedRandom" type="checkbox">抽選を固定して比較</label>
    <button id="reset" type="button">同じ盤面に戻す</button>
  </div>
  <section class="gauge-box" aria-label="投擲パワー">
    <div class="gauge-label"><span>20% / 弱い</span><span id="liveValue">60%</span><span>100% / 強い</span></div>
    <div class="gauge"><div class="zones"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="needle" id="needle"></div></div>
    <div class="legend"><b>弱すぎる</b><b>弱い</b><b>普通</b><b>ジャスト</b><b>強い</b><b>強すぎる</b></div>
  </section>
  <section class="stage">
    <canvas id="canvas" width="720" height="720" aria-label="固定盤面で投擲を確認するリング"></canvas>
    <button id="throw" type="button" aria-label="現在の強さで中央へ投げる">投げる</button>
  </section>
  <div class="status" id="status"><strong>リングをタップして投げる</strong><span>中央の十字へ投擲します。</span></div>
</main>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d"),needle=document.getElementById("needle"),live=document.getElementById("liveValue"),status=document.getElementById("status"),throwButton=document.getElementById("throw"),density=document.getElementById("density"),fixedRandom=document.getElementById("fixedRandom");
const DPR=Math.min(2,window.devicePixelRatio||1),SIZE=720,R=39,TARGET={x:360,y:360},MAX_RADIUS=288,STRIKER=30;
const zones=[
 {name:"弱すぎる",max:.30,power:.38,reach:.24,flipQuality:0,lift:2.75,travel:1.1,duration:.68,turns:.04},
 {name:"弱い",max:.44,power:.60,reach:.42,flipQuality:.72,lift:4.4,travel:0,duration:.82,turns:.50},
 {name:"普通",max:.62,power:.84,reach:.58,flipQuality:.94,lift:22,travel:15,duration:.74,turns:.82},
 {name:"ジャスト",max:.70,power:.96,reach:.72,flipQuality:1.08,lift:48,travel:30,duration:.66,turns:1},
 {name:"強い",max:.88,power:1.12,reach:.84,flipQuality:.98,lift:72.45,travel:43,duration:.58,turns:1.45},
 {name:"強すぎる",max:1,power:1.28,reach:.96,flipQuality:.80,lift:95,travel:62,duration:.52,turns:2.05}
];
let template=[],cards=[],phase=0,last=performance.now(),running=false,animStart=0,currentZone=null,results=null,throwSerial=0;
function rngFactory(seed){let a=seed>>>0;return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(r,a,b)=>a+(b-a)*r();
function footprint(c){const q=c.r*.1,cs=Math.cos(c.rot),sn=Math.sin(c.rot),p=[[-c.r+q,-c.r],[c.r-q,-c.r],[c.r,-c.r+q],[c.r,c.r-q],[c.r-q,c.r],[-c.r+q,c.r],[-c.r,c.r-q],[-c.r,-c.r+q]];return p.map(([x,y])=>({x:c.x+x*cs-y*sn,y:c.y+x*sn+y*cs}))}
function polyOverlap(a,b){for(const p of [a,b])for(let i=0;i<p.length;i++){const q=p[i],n=p[(i+1)%p.length],ax=-(n.y-q.y),ay=n.x-q.x;let amin=Infinity,amax=-Infinity,bmin=Infinity,bmax=-Infinity;for(const v of a){const z=v.x*ax+v.y*ay;amin=Math.min(amin,z);amax=Math.max(amax,z)}for(const v of b){const z=v.x*ax+v.y*ay;bmin=Math.min(bmin,z);bmax=Math.max(bmax,z)}if(amax<=bmin||bmax<=amin)return false}return true}
function overlap(a,b){return polyOverlap(footprint(a),footprint(b))}
function overlapAmount(a,b){const d=Math.hypot(a.x-b.x,a.y-b.y);if(!overlap(a,b))return 0;if(d<.001)return 1;return clamp(1-d/(a.r*2.45),0,1)}
function stackOverlap(a,b){return overlap(a,b)&&overlapAmount(a,b)>=.08}
function samplePoints(c){const p=[{x:c.x,y:c.y}];for(let ring=1;ring<=2;ring++){const rr=c.r*(ring===1?.46:.82),n=ring===1?8:24;for(let k=0;k<n;k++){const a=k/n*Math.PI*2+c.rot;p.push({x:c.x+Math.cos(a)*rr,y:c.y+Math.sin(a)*rr})}}return p}
function pointCovered(p,c){const cs=Math.cos(-c.rot),sn=Math.sin(-c.rot),dx=p.x-c.x,dy=p.y-c.y,x=Math.abs(dx*cs-dy*sn),y=Math.abs(dx*sn+dy*cs),q=c.r*.1;return x<=c.r&&y<=c.r&&x+y<=2*c.r-q}
function impactInfo(list,i,maxRadius){const upp=[];for(let u=i+1;u<list.length;u++)if(stackOverlap(list[i],list[u]))upp.push(u);const ps=samplePoints(list[i]);let exposed=0;for(const p of ps){const inRange=Math.hypot(p.x-TARGET.x,p.y-TARGET.y)<maxRadius,covered=upp.some(u=>pointCovered(p,list[u]));if(inRange&&!covered)exposed++}return{upp,exposed:exposed/ps.length}}
function buildBoard(){const count=+density.value,rng=rngFactory(918273+count),out=[],types=["attack","defense"];for(let i=0;i<count;i++){let p,tries=0;do{p={x:rnd(rng,112,608),y:rnd(rng,112,608)};tries++}while(tries<90&&out.some(c=>Math.hypot(c.x-p.x,c.y-p.y)<R*1.35));out.push({x:p.x,y:p.y,r:R,rot:rnd(rng,-.55,.55),weight:rnd(rng,.85,1.25),type:types[i%2],face:0,z:0,anim:null})}template=out;resetBoard()}
function resetBoard(){cards=template.map(c=>({...c,anim:null,face:0,z:0}));running=false;throwButton.disabled=false;results=null;throwSerial=0;status.innerHTML="<strong>リングをタップして投げる</strong><span>中央の十字へ投擲します。</span>"}
function gauge(){return .20+.80*((Math.sin(phase*Math.PI*2-Math.PI/2)+1)/2)}
function classify(g){return zones.find(z=>g<=z.max)||zones[5]}
function startThrow(){if(running)return;cards=template.map(c=>({...c,anim:null,face:0,z:0}));const g=gauge(),zone=classify(g),seed=fixedRandom.checked?445566:(Date.now()^((++throwSerial)*7919)),rng=rngFactory(seed),impactRadius=MAX_RADIUS*zone.reach,infos=cards.map((_,i)=>impactInfo(cards,i,impactRadius));currentZone=zone;results={moved:0,flipped:0,blocked:0,gauge:g,impactRadius};
  for(let i=cards.length-1;i>=0;i--){const c=cards[i],inf=infos[i],d=Math.hypot(c.x-TARGET.x,c.y-TARGET.y),fall=clamp(1-d/impactRadius,0,1),spatial=inf.exposed*(.72+fall*.28);if(inf.upp.length&&inf.exposed<.48){results.blocked++;continue}const impulse=zone.power*spatial;if(impulse<=.02)continue;const impact=clamp(impulse/c.weight,0,1.35),direct=clamp(1-d/(c.r+STRIKER),0,1);let behavior="stop";if(direct>.08)behavior="direct";else if(impact>=.70)behavior="high";else if(impact>=.40)behavior="short";else if(impact>=.22)behavior="edge";if(behavior==="stop")continue;let chance={edge:.06,short:.38,high:.66,direct:.78}[behavior];chance+=clamp((impact-.42)*.26,-.04,.18)+direct*.20;chance*=zone.flipQuality;chance*=1/(1+inf.upp.length*.52);chance=clamp(chance,0,.90);const flip=chance>0&&rng()<chance,ux=(c.x-TARGET.x)/Math.max(1,d),uy=(c.y-TARGET.y)/Math.max(1,d),tx=-uy,ty=ux,lateral=behavior==="edge"?.18:rnd(rng,.16,.36),mx=ux*(1-lateral)+tx*lateral,my=uy*(1-lateral)+ty*lateral,ml=Math.max(.001,Math.hypot(mx,my)),variation=rnd(rng,.96,1.04),travel=zone.travel*(c.r/54)*variation,lift=zone.lift*(c.r/54)*variation*1.25;c.anim={sx:c.x,sy:c.y,ex:c.x+mx/ml*travel,ey:c.y+my/ml*travel,lift,duration:zone.duration*1.05,flip,chance,turns:zone.turns};results.moved++;if(flip)results.flipped++}
  running=true;animStart=performance.now();throwButton.disabled=true;status.innerHTML=`<strong>${zone.name} / ${Math.round(g*100)}%</strong><span>同じ盤面・同じ着弾点で再生中……</span>`}
function update(now){if(!running)return;let done=true;for(const c of cards){if(!c.anim)continue;const p=clamp((now-animStart)/1000/c.anim.duration,0,1),ease=1-Math.pow(1-p,3),arch=Math.sin(Math.PI*p);c.x=c.anim.sx+(c.anim.ex-c.anim.sx)*ease;c.y=c.anim.sy+(c.anim.ey-c.anim.sy)*ease;c.z=c.anim.lift*Math.pow(Math.max(0,arch),.62);c.tilt=Math.PI*c.anim.turns*ease;if(p<1)done=false;else{c.face=c.anim.flip?1:0;c.z=0}}if(done){running=false;throwButton.disabled=false;const phrase=results.flipped?`${results.flipped}枚が裏返った`:`裏返らなかった`;const trait=currentZone===zones[5]?"回転しすぎて収まりにくい。":currentZone===zones[4]?"回転がかかりすぎる。":currentZone===zones[3]?"一番めくりが安定。":currentZone===zones[2]?"狙いどころになる。":"";status.innerHTML=`<strong>${currentZone.name} / ${Math.round(results.gauge*100)}% — ${phrase}</strong><span>${trait} 動いた ${results.moved}枚・重なりで停止 ${results.blocked}枚。次の投擲も同じ初期盤面から始まります。</span>`;setTimeout(()=>{if(!running)cards=template.map(c=>({...c,anim:null,face:0,z:0}))},500)}}
function pathCard(r){const q=r*.11;ctx.beginPath();ctx.moveTo(-r+q,-r);ctx.lineTo(r-q,-r);ctx.lineTo(r,-r+q);ctx.lineTo(r,r-q);ctx.lineTo(r-q,r);ctx.lineTo(-r+q,r);ctx.lineTo(-r,r-q);ctx.lineTo(-r,-r+q);ctx.closePath()}
function drawIcon(c,r){ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();if(c.type==="attack"){ctx.moveTo(-r*.38,0);ctx.lineTo(r*.2,0);ctx.moveTo(r*.02,-r*.22);ctx.lineTo(r*.3,0);ctx.lineTo(r*.02,r*.22)}else{ctx.moveTo(0,-r*.32);ctx.lineTo(r*.28,-r*.16);ctx.lineTo(r*.22,r*.2);ctx.lineTo(0,r*.38);ctx.lineTo(-r*.22,r*.2);ctx.lineTo(-r*.28,-r*.16);ctx.closePath()}ctx.stroke()}
function drawCard(c){const height=c.z||0,ratio=clamp(height/80,0,1),air=1+ratio*.22,shadow=1-ratio*.28,tilt=c.tilt||0,flat=Math.max(.08,Math.abs(Math.cos(tilt)));ctx.save();ctx.globalAlpha=.32;ctx.translate(c.x+9+ratio*8,c.y+10+ratio*6);ctx.rotate(c.rot);ctx.scale(shadow,shadow*.84);ctx.fillStyle="#000";pathCard(c.r);ctx.fill();ctx.restore();ctx.save();ctx.translate(c.x,c.y-height);ctx.rotate(c.rot);ctx.scale(air,air*flat);ctx.fillStyle="#292929";pathCard(c.r);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle="#777";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-c.r*.78,-c.r*.78);ctx.lineTo(c.r*.78,c.r*.78);ctx.moveTo(c.r*.78,-c.r*.78);ctx.lineTo(-c.r*.78,c.r*.78);ctx.stroke();if(!c.face)drawIcon(c,c.r);ctx.restore()}
function draw(){ctx.clearRect(0,0,SIZE,SIZE);ctx.fillStyle="#252525";ctx.fillRect(56,56,608,608);ctx.strokeStyle="#888";ctx.lineWidth=3;ctx.strokeRect(56,56,608,608);if(results?.impactRadius){ctx.save();ctx.setLineDash([7,7]);ctx.strokeStyle="#f6d365";ctx.lineWidth=2;ctx.beginPath();ctx.arc(TARGET.x,TARGET.y,results.impactRadius,0,Math.PI*2);ctx.stroke();ctx.restore()}ctx.strokeStyle="#ddd";ctx.lineWidth=2;ctx.beginPath();ctx.arc(TARGET.x,TARGET.y,18,0,Math.PI*2);ctx.moveTo(TARGET.x-28,TARGET.y);ctx.lineTo(TARGET.x+28,TARGET.y);ctx.moveTo(TARGET.x,TARGET.y-28);ctx.lineTo(TARGET.x,TARGET.y+28);ctx.stroke();for(const c of cards)drawCard(c);ctx.fillStyle="#aaa";ctx.font="18px monospace";ctx.fillText("TAP TO THROW",72,92)}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!running)phase=(phase+dt*.55)%1;const g=gauge();needle.style.left=`${(g-.2)/.8*100}%`;live.textContent=`${Math.round(g*100)}%`;update(now);draw();requestAnimationFrame(frame)}
throwButton.onclick=startThrow;document.getElementById("reset").onclick=resetBoard;density.onchange=buildBoard;buildBoard();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
