:root[data-theme=&quot;light&quot;] {

}

h3,
h4,
h5,

}

b,
strong,
th {

}

}

.table-responsive {

  overflow-x: auto;

}

  color: var(--foreground);
  font: inherit;

}

.table :is(th, td) {

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

.table .text-nowrap {

}

  width: 100%;
  padding: 0;

}

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  font-weight: var(--font-weight-medium);

}

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {

.btn,

}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

}

}

  white-space: normal;
}

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {

  background: transparent;

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {

  opacity: 0.4;

[data-lucide] {

}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  color: var(--foreground);
  background-color: var(--secondary);

.form-select:focus-visible {

.form-check {

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,
    box-shadow 150ms;

}

}

.form-check-label {

}

.form-switch .form-check-input {

  border-radius: var(--radius-full);

  box-shadow: var(--shadow-sm);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-switch .form-check-input:focus-visible {

  padding: 0;

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

  width: 20px;

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;menko-design-directions&quot;);
    const foreground = getComputedStyle(root).getPropertyValue(&quot;--foreground&quot;).trim();
    const midtone = getComputedStyle(root).getPropertyValue(&quot;--muted-foreground&quot;).trim();
    const background = getComputedStyle(root).getPropertyValue(&quot;--background&quot;).trim();

    const renderPixelEmoji = canvas =&gt; {
      const gridSize = canvas.width;
      const coarse = canvas.dataset.detail === &quot;coarse&quot;;
      const source = document.createElement(&quot;canvas&quot;);
      source.width = 96;
      source.height = 96;
      const sourceContext = source.getContext(&quot;2d&quot;, { willReadFrequently: true });
      sourceContext.font = &#x27;72px &quot;Segoe UI Emoji&quot;, &quot;Apple Color Emoji&quot;, &quot;Noto Color Emoji&quot;, sans-serif&#x27;;
      sourceContext.textAlign = &quot;center&quot;;
      sourceContext.textBaseline = &quot;middle&quot;;
      sourceContext.fillText(canvas.dataset.emoji, 48, 51);

      const sample = document.createElement(&quot;canvas&quot;);
      sample.width = gridSize;
      sample.height = gridSize;
      const sampleContext = sample.getContext(&quot;2d&quot;, { willReadFrequently: true });
      sampleContext.imageSmoothingEnabled = true;
      sampleContext.drawImage(source, 0, 0, gridSize, gridSize);

      const pixels = sampleContext.getImageData(0, 0, gridSize, gridSize).data;
      const context = canvas.getContext(&quot;2d&quot;);
      context.clearRect(0, 0, gridSize, gridSize);
      for (let y = 0; y &lt; gridSize; y += 1) {
        for (let x = 0; x &lt; gridSize; x += 1) {
          const offset = (y * gridSize + x) * 4;
          const alpha = pixels[offset + 3] / 255;
          if (alpha &lt; 0.08) continue;
          const luminance = (
            pixels[offset] * 0.2126 +
            pixels[offset + 1] * 0.7152 +
            pixels[offset + 2] * 0.0722
          ) / 255;
          context.globalAlpha = alpha;
          context.fillStyle = background;
          context.fillRect(x, y, 1, 1);
          if (canvas.dataset.palette === &quot;shield-two&quot;) {
            context.globalAlpha = alpha;
            context.fillStyle = luminance &gt;= 0.3 &amp;&amp; luminance &lt; 0.68
              ? midtone
              : foreground;
            context.fillRect(x, y, 1, 1);
          } else if (canvas.dataset.palette === &quot;flat-three&quot;) {
            context.globalAlpha = alpha;
            context.fillStyle = luminance &gt;= 0.68
              ? foreground
              : (luminance &gt;= 0.3 ? midtone : background);
            context.fillRect(x, y, 1, 1);
          } else {
            const tone = coarse
              ? (luminance &gt;= 0.55 ? 0.9 : 0.52)
              : (0.38 + luminance * 0.62);
            context.globalAlpha = alpha * tone;
            context.fillStyle = foreground;
            context.fillRect(x, y, 1, 1);
          }
        }
      }
      if (canvas.dataset.squareTop === &quot;true&quot;) {
        let topY = -1;
        for (let y = 0; y &lt; gridSize &amp;&amp; topY &lt; 0; y += 1) {
          for (let x = 0; x &lt; gridSize; x += 1) {
            if (pixels[(y * gridSize + x) * 4 + 3] &gt; 20) {
              topY = y;
              break;
            }
          }
        }
        const shoulderY = Math.min(topY + 2, gridSize - 1);
        let left = gridSize;
        let right = -1;
        for (let x = 0; x &lt; gridSize; x += 1) {
          if (pixels[(shoulderY * gridSize + x) * 4 + 3] &gt; 20) {
            left = Math.min(left, x);
            right = Math.max(right, x);
          }
        }
        context.globalAlpha = 1;
        context.fillStyle = background;
        context.fillRect(left, topY, right - left + 1, 2);
        context.globalAlpha = 0.9;
        context.fillStyle = foreground;
        context.fillRect(left, topY, right - left + 1, 2);
      }
      if (canvas.dataset.smoothLeft === &quot;true&quot;) {
        const rendered = context.getImageData(0, 0, gridSize, gridSize).data;
        const leftEdges = Array(gridSize).fill(-1);
        for (let y = 0; y &lt; gridSize; y += 1) {
          for (let x = 0; x &lt; gridSize; x += 1) {
            if (rendered[(y * gridSize + x) * 4 + 3] &gt; 20) {
              leftEdges[y] = x;
              break;
            }
          }
        }
        for (let y = 2; y &lt; gridSize - 2; y += 1) {
          if (leftEdges[y - 1] &lt; 0 || leftEdges[y] &lt; 0 || leftEdges[y + 1] &lt; 0) continue;
          const neighbors = [leftEdges[y - 1], leftEdges[y], leftEdges[y + 1]].sort((a, b) =&gt; a - b);
          const targetLeft = neighbors[1];
          if (leftEdges[y] &lt; targetLeft) {
            context.clearRect(leftEdges[y], y, targetLeft - leftEdges[y], 1);
          } else if (leftEdges[y] &gt; targetLeft) {
            context.globalAlpha = 1;
            context.fillStyle = background;
            context.fillRect(targetLeft, y, leftEdges[y] - targetLeft, 1);
            context.globalAlpha = 0.72;
            context.fillStyle = foreground;
            context.fillRect(targetLeft, y, leftEdges[y] - targetLeft, 1);
          }
        }
        const trimmed = context.getImageData(0, 0, gridSize, gridSize).data;
        for (let y = 4; y &lt;= Math.min(13, gridSize - 3); y += 1) {
          for (let x = 0; x &lt; gridSize; x += 1) {
            if (trimmed[(y * gridSize + x) * 4 + 3] &gt; 20) {
              context.globalAlpha = 1;
              context.fillStyle = background;
              context.fillRect(x, y, 1, 1);
              break;
            }
          }
        }
      }
      if (canvas.dataset.symmetricOutline === &quot;true&quot;) {
        const rendered = context.getImageData(0, 0, gridSize, gridSize).data;
        const half = Math.floor(gridSize / 2);
        for (let y = 0; y &lt; gridSize; y += 1) {
          for (let x = 0; x &lt; half; x += 1) {
            const mirrorX = gridSize - 1 - x;
            const leftOffset = (y * gridSize + x) * 4;
            const rightOffset = (y * gridSize + mirrorX) * 4;
            const leftAlpha = rendered[leftOffset + 3];
            const rightAlpha = rendered[rightOffset + 3];
            if (rightAlpha &gt; 20 &amp;&amp; leftAlpha &lt;= 20) {
              context.globalAlpha = 1;
              context.fillStyle = background;
              context.fillRect(x, y, 1, 1);
              context.globalAlpha = rightAlpha / 255;
              context.fillStyle = foreground;
              context.fillRect(x, y, 1, 1);
            } else if (rightAlpha &lt;= 20 &amp;&amp; leftAlpha &gt; 20) {
              context.globalAlpha = 1;
              context.fillStyle = background;
              context.fillRect(x, y, 1, 1);
            }
          }
        }
      }
      if (canvas.dataset.fillHoles === &quot;true&quot;) {
        for (let y = 0; y &lt; gridSize; y += 1) {
          let first = -1;
          let last = -1;
          for (let x = 0; x &lt; gridSize; x += 1) {
            if (pixels[(y * gridSize + x) * 4 + 3] &gt; 20) {
              if (first &lt; 0) first = x;
              last = x;
            }
          }
          if (first &lt; 0 || last &lt;= first) continue;
          for (let x = first; x &lt;= last; x += 1) {
            if (pixels[(y * gridSize + x) * 4 + 3] &lt;= 20) {
              context.globalAlpha = 1;
              context.fillStyle = foreground;
              context.fillRect(x, y, 1, 1);
            }
          }
        }
      }
      if (canvas.dataset.palette === &quot;shield-fixed&quot;) {
        const center = (gridSize - 1) / 2;
        const bounds = Array(gridSize).fill(null);
        for (let y = 0; y &lt; gridSize; y += 1) {
          let radius = -1;
          for (let x = 0; x &lt; gridSize; x += 1) {
            if (pixels[(y * gridSize + x) * 4 + 3] &gt; 20) {
              radius = Math.max(radius, Math.abs(x - center));
            }
          }
          if (radius &gt;= 0) {
            bounds[y] = [
              Math.max(0, Math.ceil(center - radius)),
              Math.min(gridSize - 1, Math.floor(center + radius))
            ];
          }
        }
        const occupiedRows = bounds
          .map((value, index) =&gt; value ? index : -1)
          .filter(index =&gt; index &gt;= 0);
        const topRow = occupiedRows[0];
        const bottomRow = occupiedRows[occupiedRows.length - 1];
        const shoulderRow = Math.min(topRow + 2, bottomRow);
        if (bounds[shoulderRow]) {
          bounds[topRow] = [...bounds[shoulderRow]];
          if (bounds[topRow + 1]) bounds[topRow + 1] = [...bounds[shoulderRow]];
        }

        context.clearRect(0, 0, gridSize, gridSize);
        bounds.forEach((bound, y) =&gt; {
          if (!bound) return;
          const [left, right] = bound;
          context.globalAlpha = 1;
          context.fillStyle = foreground;
          context.fillRect(left, y, right - left + 1, 1);

          if (y &gt;= topRow + 2 &amp;&amp; y &lt; bottomRow &amp;&amp; left + 1 &lt; Math.floor(center)) {
            const grayRight = Math.floor(center) - 1;
            context.fillStyle = midtone;
            context.fillRect(left + 1, y, grayRight - left, 1);
          }
        });
      }
      if (canvas.dataset.palette === &quot;shield-manual&quot;) {
        const rows = [
          [2, 15],
          [1, 16],
          [1, 16],
          [1, 16],
          [1, 16],
          [1, 16],
          [1, 16],
          [1, 16],
          [1, 16],
          [1, 16],
          [2, 15],
          [3, 14],
          [4, 13],
          [5, 12],
          [6, 11],
          [7, 10],
          [8, 9],
          null
        ];
        context.clearRect(0, 0, gridSize, gridSize);
        rows.forEach((bound, y) =&gt; {
          if (!bound) return;
          const [left, right] = bound;
          context.globalAlpha = 1;
          context.fillStyle = foreground;
          context.fillRect(left, y, right - left + 1, 1);

          if (y &gt;= 2 &amp;&amp; y &lt;= 14) {
            const grayStart = left + 1;
            const grayEnd = Math.min(8, right - 1);
            if (grayEnd &gt;= grayStart) {
              context.fillStyle = background;
              context.fillRect(grayStart, y, grayEnd - grayStart + 1, 1);
              context.globalAlpha = 0.58;
              context.fillStyle = foreground;
              context.fillRect(grayStart, y, grayEnd - grayStart + 1, 1);
            }
          }
        });
      }
      context.globalAlpha = 1;
    };
    root.querySelectorAll(&quot;.pixel-emoji&quot;).forEach(renderPixelEmoji);

    const labels = {
      A: &quot;A　正方形・薄型&quot;,
      B: &quot;B　小さな角落とし・薄型&quot;,
      C: &quot;C　折り面強調・厚型&quot;
    };
    root.querySelectorAll(&quot;[data-face]&quot;).forEach(button =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        const back = button.dataset.face === &quot;back&quot;;
        root.classList.toggle(&quot;is-back&quot;, back);
        root.querySelectorAll(&quot;[data-face]&quot;).forEach(peer =&gt; {
          peer.classList.toggle(&quot;btn-primary&quot;, peer === button);
        });
      });
    });
    root.querySelectorAll(&quot;[data-mark]&quot;).forEach(button =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        const defense = button.dataset.mark === &quot;defense&quot;;
        root.classList.toggle(&quot;is-defense&quot;, defense);
        root.querySelectorAll(&quot;[data-mark]&quot;).forEach(peer =&gt; {
          peer.classList.toggle(&quot;btn-primary&quot;, peer === button);
        });
      });
    });
    root.querySelectorAll(&quot;[data-option]&quot;).forEach(button =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        root.querySelectorAll(&quot;[data-option]&quot;).forEach(peer =&gt; {
          const selected = peer === button;
          peer.classList.toggle(&quot;is-selected&quot;, selected);
          peer.setAttribute(&quot;aria-pressed&quot;, String(selected));
        });
        root.querySelector(&quot;[data-selected]&quot;).textContent = labels[button.dataset.option];
      });
    });
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
